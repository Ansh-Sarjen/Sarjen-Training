<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .controls {
            margin-bottom: 20px;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-add:hover {
            background-color: #218838;
        }

        .search {
            margin-bottom: 15px;
        }

        .search input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #007bff;
            color: white;
        }

        th {
            padding: 10px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background-color: #f9f9f9;
        }

        .btn-edit {
            background-color: #007bff;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
            margin-right: 5px;
        }

        .btn-edit:hover {
            background-color: #0056b3;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>

</head>

<body>
    <div class="container">
        <h1>View All Users</h1>

        <div id="message" class="message\"></div>

        <div class="controls">
            <a href="add.html" class="btn-add">+ Add New User</a>
        </div>

        <div class="search">
            <input type="text" id="search" placeholder="Search by name, email, or number...">
        </div>

        <div id="tableContainer"></div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem("users")) || [];
        const tableContainer = document.getElementById("tableContainer");
        const messageDiv = document.getElementById("message");
        const searchInput = document.getElementById("search");

        function showMessage(text) {
            messageDiv.textContent = text;
            messageDiv.classList.add("show");
            setTimeout(() => {
                messageDiv.classList.remove("show");
            }, 3000);
        }

        function renderTable(usersToShow = users) {
            if (usersToShow.length === 0) {
                tableContainer.innerHTML = '<div class="empty">No users found. <a href="add.html">Add one now</a></div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Number</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            usersToShow.forEach(user => {
                html += `
                    <tr>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.number}</td>
                        <td>
                            <a href="edit.html?id=${user.id}" class="btn-edit">Edit</a>
                            <button class="btn-delete" onclick="deleteUser('${user.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            tableContainer.innerHTML = html;
        }

        function deleteUser(id) {
            if (confirm("Are you sure?")) {
                users = users.filter(u => u.id !== id);
                localStorage.setItem("users", JSON.stringify(users));
                showMessage("User deleted!");
                
                const searchTerm = searchInput.value.toLowerCase();
                if (searchTerm) {
                    filterTable();
                } else {
                    renderTable();
                }
            }
        }

        function filterTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = users.filter(user =>
                user.name.toLowerCase().indexOf(searchTerm) > -1 ||
                user.email.toLowerCase().indexOf(searchTerm) > -1 ||
                user.number.toLowerCase().indexOf(searchTerm) > -1
            );
            renderTable(filtered);
        }

        searchInput.addEventListener("input", filterTable);
        renderTable();
    </script>
</body>

</html>
