<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            padding: 8px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-update {
            background-color: #007bff;
            color: white;
        }

        .btn-update:hover {
            background-color: #0056b3;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            margin-left: 5px;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .nav-links {
            margin-top: 15px;
            text-align: center;
        }

        .nav-links a {
            color: #007bff;
            text-decoration: none;
            margin: 0 10px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Edit User</h1>

        <div id="message" class="message"></div>
        <div id="formContainer" class="loading">Loading...</div>

        <div class="nav-links">
            <a href="view.html">View Users</a>
        </div>
    </div>

    <script>
        const formContainer = document.getElementById("formContainer");
        const messageDiv = document.getElementById("message");
        let userId = null;
        let users = JSON.parse(localStorage.getItem("users")) || [];

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = "message " + type;
            messageDiv.style.display = "block";
            setTimeout(() => {
                messageDiv.style.display = "none";
            }, 3000);
        }

        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function loadForm() {
            userId = getUrlParameter("id");

            if (!userId) {
                formContainer.innerHTML = '<p style="color: #dc3545;">Error: No user found!</p>';
                return;
            }

            const user = users.find(u => u.id === userId);
            if (!user) {
                formContainer.innerHTML = '<p style="color: #dc3545;">Error: User not found!</p>';
                return;
            }

            formContainer.innerHTML = `
                <form id="userForm">
                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" id="name" value="${user.name}" required>
                    </div>

                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="email" value="${user.email}" required>
                    </div>

                    <div class="form-group">
                        <label>Number:</label>
                        <input type="text" id="number" value="${user.number}" required>
                    </div>

                    <button type="submit" class="btn-update">Update</button>
                    <button type="button" class="btn-cancel" onclick="goBack()">Cancel</button>
                    <button type="button" class="btn-delete" onclick="deleteUser()">Delete</button>
                </form>
            `;

            document.getElementById("userForm").addEventListener("submit", updateUser);
        }

        function updateUser(e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const number = document.getElementById("number").value.trim();

            if (!name || !email || !number) {
                showMessage("All fields are required!", "error");
                return;
            }

            const emailExists = users.some(u => u.email === email && u.id !== userId);
            if (emailExists) {
                showMessage("This email already exists!", "error");
                return;
            }

            const userIndex = users.findIndex(u => u.id === userId);
            if (userIndex !== -1) {
                users[userIndex] = { id: userId, name: name, email: email, number: number };
                localStorage.setItem("users", JSON.stringify(users));
                showMessage("User updated! Redirecting...", "success");
                
                setTimeout(() => {
                    window.location.href = "view.html";
                }, 1500);
            }
        }

        function deleteUser() {
            if (confirm("Are you sure?")) {
                users = users.filter(u => u.id !== userId);
                localStorage.setItem("users", JSON.stringify(users));
                showMessage("User deleted! Redirecting...", "success");
                
                setTimeout(() => {
                    window.location.href = "view.html";
                }, 1500);
            }
        }

        function goBack() {
            window.location.href = "view.html";
        }

        loadForm();
    </script>
</body>

</html>
